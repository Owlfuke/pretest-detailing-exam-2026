name: Deploy exam frontend to GitHub Pages

on:
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  deploy:
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Build public artifact
        env:
          SUPABASE_URL: ${{ secrets.SUPABASE_URL }}
          SUPABASE_PUBLISHABLE_KEY: ${{ secrets.SUPABASE_PUBLISHABLE_KEY }}
        run: |
          test -n "$SUPABASE_URL"
          test -n "$SUPABASE_PUBLISHABLE_KEY"
          mkdir -p dist
          cp index.html app.js styles.css dist/
          cp config.example.js dist/config.js
          cp -R assets dist/assets
          sed -i "s|__SUPABASE_URL__|${SUPABASE_URL}|" dist/config.js
          sed -i "s|__SUPABASE_PUBLISHABLE_KEY__|${SUPABASE_PUBLISHABLE_KEY}|" dist/config.js
          sed -i "s|demoMode: true|demoMode: false|" dist/config.js
          if grep -R -E "rittacoth-my\.sharepoint\.com|IQCU0J6nUw-uT78aKb2SF|MrbwCVn2XJE|KvpzvD8Zko" dist; then
            echo "Post-exam resource URL leaked into frontend artifact"
            exit 1
          fi
      - uses: actions/configure-pages@v5
      - uses: actions/upload-pages-artifact@v3
        with:
          path: dist
      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4
